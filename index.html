<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam recomendações</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="titulo_e_subtitulo">
        <h1 class="titulo">Aplicativos e jogos recomendados</h1>
        <p class="descrição">Confira os aplicativos e jogos que recomendamos para você!</p>
    </div>
    <div class="toggle-container">
    <input type="checkbox" id="modo">
    <label for="modo" class="toggle">
        <span class="icone sol">☀️</span>
        <span class="icone lua">🌙</span>
    </label>
</div>
    <script>
const checkbox = document.getElementById("modo");

// Aplicar modo salvo
if (localStorage.getItem("modo") === "dark") {
    document.body.classList.add("dark");
    checkbox.checked = true;
}

// Evento do botão
checkbox.addEventListener("change", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        localStorage.setItem("modo", "dark");
    } else {
        localStorage.setItem("modo", "light");
    }
});
</script>

<div class="sla">

    <div class="jogo jogo-lethal">
     <img class="lethal" src="https://wallpapers.com/images/featured/lethal-company-7zicq03gmonmnhvf.jpg" alt="Imagem do jogo lethal company" width="650" >
     <div class="overlay">
        <button  class = "lethal" onclick="window.location.href='lethal-company.html'">Ver detalhes</button>
    </div>
    </div>

    <div class="jogo jogo-ultrakill">
     <img class="ultrakill" src="https://images.steamusercontent.com/ugc/2010327338016462147/9D6943213DA016A42507CE6AEC8EF62D2C88EDBB/?imw=637&imh=358&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true" alt="Imagem do jogo ultrakill" width="650">
     <div class="overlay">
        <button class = "ultrakill" onclick="window.location.href='ultrakill.html'">Ver detalhes</button>
    </div>
    </div>

    <div class="jogo jogo-easy-delivery">
     <img class="easy-delivery" src="https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3293010/4221fe933bbdff1d0365200a8801581279c3930e/capsule_616x353_alt_assets_0.jpg?t=1768499501" alt="Imagem do jogo easy delivery co." width="650">
     <div class="overlay">
        <button class = "easy-delivery" onclick="window.location.href='easy-delivery.html'">Ver detalhes</button>

    <div class="jogo jogo-misery">

     <div class="overlay">
        <button class = "misery" onclick="window.location.href='misery.html'">Ver detalhes</button>
    </div>
    </div>

</div>

</html>
